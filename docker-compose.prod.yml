# Reference docker-compose for the production server.
# Place this at /opt/lti-ox6q/docker-compose.yml on the server.
# Place secrets at /opt/lti-ox6q/.env (chmod 600).
#
# .env must contain:
#   APP_KEY=base64:...          (php artisan key:generate --show in a local container)
#   DB_PASSWORD=...             (single password for lti_user — used by both backend and mariadb)
#   MYSQL_ROOT_PASSWORD=...     (strong random password for MariaDB root — not used by the app)
#   LOCAL_JWT_SECRET=...
#   OPENAI_API_KEY=...
#   TOOLSUPPORT_JWKS_URL=...
#   TOOLSUPPORT_JWT_ISS=...
#   TOOLSUPPORT_JWT_AUD=...

name: lti-ox6q

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      # Docker Compose resolves ${...} from the .env file in this directory
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: lti_ox6q
      MYSQL_USER: lti_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    # NOT exposed publicly — backend connects via internal network
    expose:
      - "3306"

  backend:
    image: ghcr.io/theotherdy/lti-ox6q/backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://learntech.medsci.ox.ac.uk/ox6q
      FRONTEND_ORIGIN: https://learntech.medsci.ox.ac.uk
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: lti_ox6q
      DB_USERNAME: lti_user
      RUN_MIGRATIONS: "1"
    ports:
      - "127.0.0.1:8000:80"   # bind to localhost only; Apache proxies here
    depends_on:
      - mariadb

  frontend:
    image: ghcr.io/theotherdy/lti-ox6q/frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:80"   # bind to localhost only; Apache proxies here

volumes:
  mariadb_data:
