name: Build and push images

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Backend ──────────────────────────────────────────────────
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      # ── Frontend ─────────────────────────────────────────────────
      # Two variables are baked into the JS bundle at build time.
      # Set them as GitHub Actions variables:
      #   Repository → Settings → Variables → Actions → New variable
      #   PRODUCTION_URL  = https://learntech.medsci.ox.ac.uk/ox6q
      #   PRODUCTION_BASE = /ox6q/
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.PRODUCTION_URL }}
            VITE_BASE_PATH=${{ vars.PRODUCTION_BASE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
