server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vite multi-entry: serve the structured-runner HTML too
    location = /structured-runner {
        try_files /structured-runner.html =404;
    }

    # All other routes fall through to index.html (SPA behaviour)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs to stdout/stderr so Docker captures them
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
