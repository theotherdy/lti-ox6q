server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Restrictive CSP for sandboxed runner pages.
    # Connect/object/frame are disabled; style inline is needed for runtime style tags.
    set $runner_csp "default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: https:; font-src 'none'; connect-src 'none'; object-src 'none'; child-src 'none'";

    location = /structured-runner {
        add_header Content-Security-Policy $runner_csp always;
        try_files /structured-runner.html =404;
    }

    location = /open-react-runner {
        add_header Content-Security-Policy $runner_csp always;
        try_files /open-react-runner.html =404;
    }

    location = /structured-runner.html {
        add_header Content-Security-Policy $runner_csp always;
        try_files /structured-runner.html =404;
    }

    location = /open-react-runner.html {
        add_header Content-Security-Policy $runner_csp always;
        try_files /open-react-runner.html =404;
    }

    # All other routes fall through to index.html (SPA behaviour)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Logs to stdout/stderr so Docker captures them
    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
