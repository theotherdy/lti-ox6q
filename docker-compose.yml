name: lti-ox6q
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/var/www/html
    environment:
      RUN_MIGRATIONS: "1"
      CACHE_DRIVER: file
      #APP_ENV: local
      #APP_DEBUG: "true"
      #APP_URL: http://localhost:8000
      #FRONTEND_ORIGIN: http://localhost:5173
      # Tool Support JWT verification (optional but recommended)
      #TOOLSUPPORT_JWKS_URL: "https://lti.canvas.ox.ac.uk/.well-known/jwks.json" #prod
      #TOOLSUPPORT_JWKS_URL: "https://tools-dev.canvas.ox.ac.uk/.well-known/jwks.json" #dev
      #TOOLSUPPORT_JWT_ISS: ""
      #TOOLSUPPORT_JWT_AUD: ""
      #TOOLSUPPORT_SKIP_SIGNATURE: "true" #REMOVE FOR PROD!
      # Local stateless API auth
      #LOCAL_JWT_SECRET: "change-me-in-compose"
    #healthcheck:
    #  test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
    #  interval: 5s
    #  timeout: 3s
    #  retries: 20

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      #- /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    #depends_on:
    #  backend:
    #    condition: service_healthy
